<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Island Guide — Redirecting…</title>
<script>
  // Redirect premium/?t=TOKEN → /?t=TOKEN (React SPA handles auth)
  var params = new URLSearchParams(window.location.search);
  var token = params.get('t');
  if (token) {
    window.location.replace('/?t=' + encodeURIComponent(token));
  } else {
    window.location.replace('/');
  }
</script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#666;">
    Loading your guide…
  </p>
</body>
</html>
